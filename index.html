<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lable — 웨이팅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/cooper-black" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:#f5f5f5;color:#111;font-family:'Inter',sans-serif}
    .frame{max-width:390px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
    .top{padding:2.5rem 1.5rem 0}
    .logo{font-family:'Cooper Black',serif;font-style:italic;font-size:36px;font-weight:700;color:#111;flex-shrink:0}
    .tagline{font-family:'Cooper Black',serif;font-style:italic;font-size:12px;color:#0055FF;text-align:right;line-height:1.2;margin-left:8px}
    .bar{display:flex;align-items:center;gap:8px;margin:1.5rem 1.5rem 0;padding:10px 14px;border:0.5px solid #e8e8e8;border-radius:10px;background:#fff}
    .bar-dot{width:6px;height:6px;border-radius:50%;background:#378ADD;flex-shrink:0}
    .bar-text{font-size:12px;color:#888;letter-spacing:0.04em}
    .form{padding:1.5rem;flex:1}
    .flabel{font-size:11px;font-weight:500;color:#999;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px;display:block}
    .frow{margin-bottom:1rem}
    input[type=text],input[type=tel],input[type=number]{width:100%;background:#fff;border:0.5px solid #e0e0e0;border-radius:10px;padding:13px 16px;font-size:15px;color:#111;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s;-webkit-appearance:none}
    input::placeholder{color:#ccc}
    input:focus{border-color:#378ADD}
    .privacy-box{background:#f9f9f9;border:0.5px solid #ebebeb;border-radius:10px;padding:14px;margin-bottom:1rem}
    .privacy-title{font-size:11px;font-weight:500;color:#999;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px}
    .privacy-text{font-size:12px;color:#aaa;line-height:1.8}
    .privacy-text .key{color:#bbb;display:inline-block;width:60px}
    .agree-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:0.5px solid #ebebeb;cursor:pointer}
    .agree-check{width:18px;height:18px;border:0.5px solid #ddd;border-radius:4px;background:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;font-size:11px;color:transparent}
    .agree-check.checked{background:#378ADD;border-color:#378ADD;color:#fff}
    .agree-label{font-size:13px;color:#888;line-height:1.4}
    .sbtn{width:100%;margin-top:0.25rem;padding:15px;border-radius:12px;border:none;background:#111;color:#fff;font-size:15px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:0.02em;transition:background 0.15s}
    .sbtn:hover:not(:disabled){background:#333}
    .sbtn:disabled{background:#e0e0e0;color:#bbb;cursor:not-allowed}
    .status{display:none;padding:1.5rem;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .status.show{display:flex}
    .rank-big{font-family:'Playfair Display',serif;font-style:italic;font-size:100px;font-weight:700;color:#111;line-height:1;letter-spacing:-0.02em}
    .rank-unit{font-size:12px;color:#aaa;letter-spacing:0.16em;text-transform:uppercase;margin-top:6px}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:500;letter-spacing:0.06em;margin:1rem 0}
    .pill.waiting{background:#EBF3FC;border:0.5px solid #B5D4F4;color:#185FA5}
    .pill.called{background:#EAF3DE;border:0.5px solid #C0DD97;color:#3B6D11}
    .pill-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
    .icard{width:100%;background:#fff;border:0.5px solid #e8e8e8;border-radius:14px;padding:1.25rem;text-align:left;margin:0.5rem 0}
    .irow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid #f0f0f0}
    .irow:last-child{border-bottom:none}
    .ikey{font-size:11px;color:#aaa;letter-spacing:0.1em;text-transform:uppercase}
    .ival{font-size:14px;color:#333}
    .btn-row{display:flex;gap:8px;margin-top:1rem;width:100%}
    .cbtn{flex:1;padding:12px;border-radius:10px;border:0.5px solid #e0e0e0;background:#fff;color:#888;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.15s}
    .cbtn:hover{border-color:#ccc;color:#555}
    .skip-btn{flex:1;padding:12px;border-radius:10px;border:0.5px solid #e0e0e0;background:#fff;color:#888;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.15s;display:none}
    .skip-btn.show{display:block}
    .skip-btn:hover{border-color:#ccc;color:#555}
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;z-index:200}
    .toast.show{opacity:1}
  </style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="logo">LABLE</div>
      <div class="tagline">I'M ABLE · WE'RE ABLE<br>L, ABLE · LABLE</div>
    </div>
  </div>
  <div class="bar">
    <div class="bar-dot"></div>
    <div class="bar-text">현재 웨이팅을 받고 있어요</div>
  </div>
  <div class="form" id="form-area">
    <div class="frow">
      <label class="flabel">이름</label>
      <input type="text" id="g-name" placeholder="홍길동" maxlength="20">
    </div>
    <div class="frow">
      <label class="flabel">전화번호</label>
      <input type="tel" id="g-phone" placeholder="010-0000-0000" maxlength="13">
    </div>
    <div class="frow">
      <label class="flabel">인원 수</label>
      <input type="number" id="g-people" placeholder="몇 명이세요?" min="1" max="20">
    </div>
    <div class="privacy-box">
      <div class="privacy-title">개인정보 수집 및 이용 안내</div>
      <div class="privacy-text">
        <span class="key">수집 항목</span> 이름, 전화번호, 방문 인원<br>
        <span class="key">수집 목적</span> 웨이팅 순서 확인 및 입장 안내<br>
        <span class="key">보유 기간</span> 입장 완료 즉시 삭제<br><br>
        수집된 개인정보는 웨이팅 안내 외 다른 용도로 사용되지 않습니다.
      </div>
      <div class="agree-row" onclick="toggleAgree()">
        <div class="agree-check" id="agree-check">✓</div>
        <div class="agree-label">위 내용을 확인했으며 개인정보 수집에 동의합니다</div>
      </div>
    </div>
    <button class="sbtn" id="submit-btn" onclick="register()" disabled>웨이팅 등록</button>
  </div>
  <div class="status" id="status-area">
    <div>
      <div class="rank-big" id="rank-num">-</div>
      <div class="rank-unit">번째 대기 중</div>
    </div>
    <div class="pill waiting" id="st-pill">
      <span class="pill-dot"></span>대기 중
    </div>
    <div class="icard">
      <div class="irow"><span class="ikey">이름</span><span class="ival" id="st-name"></span></div>
      <div class="irow"><span class="ikey">인원</span><span class="ival" id="st-people"></span></div>
      <div class="irow"><span class="ikey">전화번호</span><span class="ival" id="st-phone"></span></div>
    </div>
    <div class="btn-row">
      <button class="cbtn" onclick="cancel()">대기 취소</button>
      <button class="skip-btn" id="skip-btn" onclick="skip()">건너뛰기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyC0MGzM4cNKoUBeHO4nAWhFcyLTwOPh1a4",
    authDomain: "lable-waiting.firebaseapp.com",
    databaseURL: "https://lable-waiting-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "lable-waiting",
    storageBucket: "lable-waiting.firebasestorage.app",
    messagingSenderId: "1073923206160",
    appId: "1:1073923206160:web:b42ad8098871463e08ee95"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const waitingRef = ref(db, 'waiting');
  let myKey = localStorage.getItem('lable_my_key');
  let allWaiting = {};
  let agreed = false;
  window.toggleAgree = function() {
    agreed = !agreed;
    document.getElementById('agree-check').className = 'agree-check' + (agreed ? ' checked' : '');
    document.getElementById('submit-btn').disabled = !agreed;
  };
  onValue(waitingRef, (snapshot) => {
    allWaiting = snapshot.val() || {};
    if (myKey && allWaiting[myKey]) {
      showStatus();
    } else if (myKey && !allWaiting[myKey]) {
      myKey = null;
      localStorage.removeItem('lable_my_key');
      showForm();
      showToast('입장이 확인됐어요! 즐거운 시간 되세요 🍺');
    }
  });
  function showStatus() {
    const entries = Object.entries(allWaiting).sort((a, b) => a[1].createdAt - b[1].createdAt);
    const idx = entries.findIndex(([k]) => k === myKey);
    const my = allWaiting[myKey];
    document.getElementById('rank-num').textContent = idx + 1;
    document.getElementById('st-name').textContent = my.name;
    document.getElementById('st-people').textContent = my.people + '명';
    document.getElementById('st-phone').textContent = my.phone;
    const pill = document.getElementById('st-pill');
    const skipBtn = document.getElementById('skip-btn');
    if (my.status === 'called') {
      pill.innerHTML = '<span class="pill-dot"></span>입장 가능 — 직원에게 말씀해주세요';
      pill.className = 'pill called';
      skipBtn.classList.add('show');
    } else {
      pill.innerHTML = '<span class="pill-dot"></span>대기 중';
      pill.className = 'pill waiting';
      skipBtn.classList.remove('show');
    }
    document.getElementById('form-area').style.display = 'none';
    document.getElementById('status-area').classList.add('show');
  }
  function showForm() {
    document.getElementById('form-area').style.display = 'block';
    document.getElementById('status-area').classList.remove('show');
  }
  window.register = async function() {
    if (!agreed) return;
    const name = document.getElementById('g-name').value.trim();
    const phone = document.getElementById('g-phone').value.trim();
    const people = parseInt(document.getElementById('g-people').value);
    if (!name) { showToast('이름을 입력해주세요'); return; }
    if (!phone) { showToast('전화번호를 입력해주세요'); return; }
    if (!people || people < 1) { showToast('인원 수를 입력해주세요'); return; }
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '등록 중...';
    const newRef = await push(waitingRef, { name, phone, people, status: 'waiting', createdAt: Date.now() });
    myKey = newRef.key;
    localStorage.setItem('lable_my_key', myKey);
    btn.textContent = '웨이팅 등록';
    showToast('웨이팅 등록 완료!');
  };
  window.cancel = async function() {
    if (!myKey) return;
    await remove(ref(db, `waiting/${myKey}`));
    myKey = null;
    localStorage.removeItem('lable_my_key');
    document.getElementById('g-name').value = '';
    document.getElementById('g-phone').value = '';
    document.getElementById('g-people').value = '';
    agreed = false;
    document.getElementById('agree-check').className = 'agree-check';
    document.getElementById('submit-btn').disabled = true;
    showForm();
    showToast('대기가 취소됐어요');
  };
  window.skip = async function() {
    if (!myKey) return;
    await update(ref(db, `waiting/${myKey}`), {
      status: 'waiting',
      createdAt: Date.now()
    });
    showToast('다음 순서로 넘어갔어요');
  };
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }
  // URL 파라미터로 자동 처리 (카카오 알림톡 버튼)
  const params = new URLSearchParams(window.location.search);
  const action = params.get("action");
  const keyFromUrl = params.get("key");

  if (action && keyFromUrl) {
    window.history.replaceState({}, "", "/");
    onValue(waitingRef, async (snapshot) => {
      const data = snapshot.val() || {};
      if (!data[keyFromUrl]) { showToast("이미 처리된 대기예요"); return; }
      if (action === "cancel") {
        await remove(ref(db, `waiting/${keyFromUrl}`));
        showToast("대기가 취소됐어요 ✅");
      } else if (action === "skip") {
        await update(ref(db, `waiting/${keyFromUrl}`), { status: "waiting", createdAt: Date.now() });
        myKey = keyFromUrl;
        localStorage.setItem("lable_my_key", myKey);
        showToast("다음 순서로 넘어갔어요 ✅");
      }
    }, { onlyOnce: true });
  } else if (myKey) {
    showStatus();
  }
</script>
</body>
</html>
